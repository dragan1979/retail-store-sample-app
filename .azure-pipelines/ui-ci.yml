# Environments" title="Create the Environments">
# In Azure DevOps left sidebar, go to Pipelines -> Environments.
# Click New environment and create three environments: development, staging, and production (choose None for resource type)
# All three environment names will appear in the Environments list
# Add Approval Gate to Production:Approvals & Checks.
# Click into the production environment.Click the three dots (...) in the top right corner and select Approvals and checks.Click + and choose Approvals.
# Add your name or your team group in the Approvers field.
# Uncheck "Allow approvers to approve their own runs" if you want a second pair of eyes, or leave it checked for personal testing.
# Click Create.Verification: When code merges to main, Stage 6 will automatically transition to "Waiting for approval" and send you an email/UI notification before deploying.