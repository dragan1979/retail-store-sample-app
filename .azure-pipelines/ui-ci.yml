  #   condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  #   jobs:
  #     - deployment: DeployCartProd
  #       displayName: 'Deploy Cart to Production ACA'
  #       environment: 'production' # UI Approval Check attached here
  #       strategy:
  #         runOnce:
  #           deploy:
  #             steps:
  #               - task: AzureContainerApps@1
  #                 displayName: 'Update Container App (Prod)'
  #                 inputs:
  #                   azureSubscription: 'azure-resource-connection'
  #                   containerAppName: 'cart-service-prod'
  #                   resourceGroup: 'rg-microservices-prod'
  #                   imageToDeploy: '$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY):$(Build.SourceVersion)'

